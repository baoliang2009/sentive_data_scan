name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            windows-latest)
              cp target/release/sentinel.exe dist/sentinel-windows-x86_64.exe
              cp target/release/sentinel-server.exe dist/sentinel-server-windows-x86_64.exe
              ;;
            macos-latest)
              cp target/release/sentinel dist/sentinel-macos-${{ runner.arch }}
              cp target/release/sentinel-server dist/sentinel-server-macos-${{ runner.arch }}
              ;;
            ubuntu-latest)
              cp target/release/sentinel dist/sentinel-linux-x86_64
              cp target/release/sentinel-server dist/sentinel-server-linux-x86_64
              ;;
          esac
          cp config/default.toml dist/default.toml
          cp config/default-server.toml dist/default-server.toml
          ls -lh dist
      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Upload macOS binary
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-macos-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Upload Linux binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-x86_64
          path: dist/*
          if-no-files-found: error
