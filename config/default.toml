# 数据哨兵 DataSentinel 配置文件
# 修改后重启守护进程生效。路径支持 ~、$HOME；相对路径相对于本文件所在目录。

[general]
language = "zh-CN"
# trace / debug / info / warn / error
log_level = "info"

[scan]
# 默认不配置扫描目录，可在此处显式指定或由服务端统一下发；
# 例如：roots = ["~/Desktop", "~/Documents", "~/work"]
roots = []

# 可信路径（glob），命中的文件永不扫描，例如测试数据目录。
allow_globs = []

# 追加排除目录（默认同时启用内置排除项；见下方 use_default_excludes）。
exclude_globs = []

# 是否启用内置排除项（缓存/VCS/回收站/图片/音视频/压缩包/可执行文件等）。
# 设为 false 后只使用本文件中的 exclude_globs / exclude_extensions。
use_default_excludes = true

# 为空表示自动识别文本与 Office 文档；设置后只扫描列出的扩展名。
include_extensions = []

# 追加跳过的扩展名（内置跳过图片/音视频/压缩包/可执行文件等）。
exclude_extensions = []

# 单文件大小上限（MB），超过则跳过并记录日志。
max_file_size_mb = 64

# 0 = 自动（CPU 核数，最多 8）；机械硬盘建议 2-4，SSD 可调高。
threads = 0

# 守护进程/开机自启后先做一次对账扫描。
scan_on_startup = true

# 定时全量对账间隔（小时）；0 = 关闭。只重新读取有变化的文件。
full_scan_interval_hours = 24

follow_symlinks = false
skip_hidden = false

# 抽取 .docx / .xlsx / .pptx 内的文本。
office_documents = true

# 分块大小（KB），用于大文件流式检测。
chunk_kb = 1024

# 命中上下文片段长度（字符数）。
context_chars = 160

[watch]
# 监听文件创建/修改/重命名，实现落盘即扫描。
enabled = true

# 为空表示复用 scan.roots。
roots = []

# 事件去抖时间（毫秒），等待写入完成。
debounce_ms = 2000

# 忽略 .tmp/.part/.swp/~$ 等临时文件。
ignore_temp_files = true

# 待扫描队列上限，超过后立即冲刷，避免内存膨胀。
max_pending = 20000

[notify]
enabled = true

# info / low / medium / high / critical
min_severity = "medium"

# summary = 每批聚合一次；per_file = 每个示例一次（有上限）；off = 不弹窗
mode = "summary"

# macOS 通知声音（其他平台由桌面环境决定）。
sound = true

# macOS 弹窗方式：
#   auto         = 中危及以上的命中使用系统对话框（不受专注模式影响），低危用通知中心
#   alert        = 始终使用系统对话框
#   notification = 仅使用通知中心（可能受“专注模式/勿扰”影响）
macos_mode = "auto"

# per_file 模式下单批最多通知数量。
max_per_batch = 5

# 已提醒过的文件被修改并保存后，如果仍然包含敏感数据，是否再次提醒。
# 只改了其他文字、敏感值没变时也会提醒（同一文件有冷却时间，避免连续保存刷屏）。
renotify_modified = true

# 同一文件的重复提醒冷却时间（秒）；0 表示不冷却。
renotify_cooldown_secs = 600

[storage]
# 为空 = 平台数据目录：
#   Windows: %LOCALAPPDATA%\DataSentinel\sentinel.db
#   macOS:   ~/Library/Application Support/DataSentinel/sentinel.db
#   麒麟/Linux: ~/.local/share/DataSentinel/sentinel.db
database = ""

# 为空 = 平台数据目录/reports
reports_dir = ""

# 默认只保存脱敏值；设为 true 会保存命中原文（不推荐）。
store_raw_match = false

# 发现记录保留天数；0 = 永久保留。
retention_days = 180

# ---------------------------------------------------------------------------
# Syslog 外发：把命中的敏感数据以 RFC 5424 报文推送到日志服务端
# ---------------------------------------------------------------------------
[syslog]
# 默认关闭。开启后只发送脱敏值（如 110105********002X），不会外泄原文。
enabled = false

# 传输协议：udp（默认，最省事）/ tcp（可靠、支持重连）/ unix（本机套接字，仅 Unix）
protocol = "udp"

# 服务端地址。UDP/TCP 必须是 host:port，例如：
#   "10.0.0.5:514"        # 标准 syslog 端口（Linux 需 root 或 CAP_NET_BIND_SERVICE）
#   "log.corp.local:5514" # 非特权端口，推荐给普通用户
#   "192.168.1.20:6514"   # rsyslog/syslog-ng TLS 端口需自行加证书代理
# unix 协议则填套接字路径，例如 "/var/run/rsyslog/dev/log"。
server = ""

# RFC 5424 facility：auth / user / daemon / local0-local7
facility = "auth"

# 只外发该级别及以上的命中：low / medium / high / critical
min_severity = "medium"

# 报文 HOSTNAME 字段；留空使用本机主机名。
hostname = ""

# 报文 APP-NAME 字段。
app_name = "DataSentinel"

# 是否附带脱敏后的上下文片段（便于服务端定位，但会带上同一行的其他文字）。
include_snippet = true

# 是否外发命中原文。默认 false；开启前请确认服务端与链路可信。
send_raw = false

# 单次发送超时（毫秒）；超时只记日志，不会阻塞扫描。
timeout_ms = 2000

# 服务端地址解析方式：
#   static = 只用上面的 server 字段
#   mdns   = 通过 mDNS/DNS-SD 在局域网自动发现服务端，无需填写 IP
#            发现失败时自动回落到 server（填了的话）
discovery = "static"

# mDNS 自动发现的服务类型，需与服务端 syslog_server.mdns_service 一致。
mdns_service = "_datasentinel._udp.local."

# 自动发现超时（毫秒）；超时后回落到静态 server。
mdns_timeout_ms = 4000

# ---------------------------------------------------------------------------
# 服务端策略同步：定时从服务端拉取扫描目录、定时扫描策略、白名单与检测规则
# ---------------------------------------------------------------------------
[server]
enabled = true
# 服务端控制台地址，例如 "https://10.0.0.5:8443"；留空时若 syslog 开启 mDNS 则自动发现
url = ""
# 与服务端 auth.agent_token 一致的共享 Token
agent_token = ""
# 拉取策略间隔（秒）
sync_interval_secs = 15
# 服务端使用自签证书且未导入系统信任库时设为 true
insecure_tls = false

# 接收端（sentinel syslog serve 自测时使用，或配合 rsyslog 做本地落盘）
[syslog_server]
enabled = false

# 监听协议：udp / tcp
protocol = "udp"

# 监听地址；0.0.0.0:5514 表示接收本机与内网全部来源
bind = "0.0.0.0:5514"

# 接收日志路径；留空写入平台数据目录下的 syslog/received.log
output = ""

# 是否通过 mDNS 广播自己，让客户端 discovery = "mdns" 自动找到本机。
advertise = true

# 广播的服务类型，需与客户端 syslog.mdns_service 一致。
mdns_service = "_datasentinel._udp.local."

# 广播的实例名；留空自动使用 DataSentinel-<主机名>。
instance = ""

[rules]
# 关闭不需要的内置规则，例如 ["cn_landline", "email"]
disabled = []

# 低于该级别的命中不记录、不提醒。
min_severity = "low"

# 自定义规则示例（取消注释即可使用）：
# [[rules.custom]]
# id = "employee_id"
# name = "员工工号"
# category = "internal"
# severity = "medium"
# pattern = 'EMP-\d{6}'
# keywords = ["员工", "工号"]
# validator = "none"
# description = "公司内部员工编号"
# context_chars = 160
#
# 说明：
# - pattern 使用 Rust regex 语法（不支持 lookaround）。
#   匹配“紧贴中文标签”的号码时，请用 `(?-u:\b)` 作为 ASCII 单词边界，
#   例如 `(?-u:\b)(\d{18})(?-u:\b)`；普通 `\b` 在中文旁会失效。
# - 第一个捕获组视为敏感值；没有捕获组时使用整段匹配。
# - validator 支持：none, luhn, bank_card, cn_id, cn_id_15, phone, landline,
#   social_security, passport, placeholder, entropy:3.2
#   多个校验器用逗号分隔，例如 "entropy:3.5,placeholder"。
#   bank_card = Luhn + 银联/国际卡组织 BIN 号段 + 卡号长度三重校验。
