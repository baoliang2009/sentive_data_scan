[package]
name = "data-sentinel"
version = "0.2.1"
edition = "2021"
description = "Cross-platform local sensitive data scanner (Windows / Kylin Linux / macOS)"
license = "MIT"
authors = ["DataSentinel"]

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dirs = "5.0"
dunce = "1.0"
encoding_rs = "0.8"
globset = "0.4"
hex = "0.4"
notify = "6.1"
rayon = "1.10"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
