<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>数据哨兵 · 本地控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23141a26'/%3E%3Cpath d='M16 7l7 3v6.2c0 3.9-2.8 7.2-7 8.8-4.2-1.6-7-4.9-7-8.8V10l7-3z' fill='none' stroke='%23fff' stroke-width='1.8'/%3E%3Ccircle cx='16' cy='15.5' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7.5 3v5.6c0 4.3-3.1 8-7.5 9.4-4.4-1.4-7.5-5.1-7.5-9.4V6L12 3z"/>
          <circle cx="12" cy="11.4" r="2.3"/>
          <path d="M12 13.7v3"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>数据哨兵</strong>
        <small>DataSentinel</small>
      </span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" data-route="overview" href="#/overview">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
        <span class="nav-label">概览</span>
      </a>
      <a class="nav-item" data-route="findings" href="#/findings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.2"/></svg>
        <span class="nav-label">命中记录</span>
        <span class="nav-count" id="nav-count" hidden>0</span>
      </a>
      <a class="nav-item" data-route="rules" href="#/rules">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 4.6 5 .6-3.7 3.4 1 4.9-4.4-2.6-4.4 2.6 1-4.9L4.9 8.2l5-.6L12 3z"/></svg>
        <span class="nav-label">检测规则</span>
      </a>
      <a class="nav-item" data-route="settings" href="#/settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span class="nav-label">设置</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="env"><span class="dot"></span><span id="platform-label">__PLATFORM__</span></div>
      <div>v<span id="version-label">__VERSION__</span> · 本地运行</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-head">
        <h1 id="page-title">概览</h1>
        <p id="page-sub">本机敏感数据扫描与落盘监控</p>
      </div>
      <div class="topbar-actions">
        <span class="chip" id="chip-watch"><i></i><span>落盘监控</span></span>
        <span class="chip" id="chip-autostart"><i></i><span>开机自启</span></span>
        <button class="btn btn-primary" data-action="open-scan">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3.2-6.9"/><path d="M21 3v6h-6"/></svg>
          立即扫描
        </button>
      </div>
    </header>

    <div id="scan-banner"></div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="drawer-overlay" id="overlay" data-action="close-drawer"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div id="modal-root"></div>
<div class="toast-stack" id="toast-root"></div>

<script>
  window.__SENTINEL__ = {
    token: "__TOKEN__",
    version: "__VERSION__",
    platform: "__PLATFORM__"
  };
</script>
<script src="/static/app.js"></script>
</body>
</html>
